[project]
name = "npu-embed"
version = "0.1.0"
description = "Sentence embeddings (multilingual MiniLM) on the Orange Pi 4 Pro NPU (Allwinner A733, VIPLite)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "tokenizers"]

[project.optional-dependencies]
dev = ["pytest"]
convert = ["torch", "transformers", "sentence-transformers", "onnx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
